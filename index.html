<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>山水問心：富春江行</title>
<style>
  :root{
    --ink:#15241f;
    --paper:#f6f0df;
    --jade:#86b9a1;
    --gold:#d4a94f;
    --red:#9f3c2f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1715;font-family:"Noto Serif TC","Microsoft JhengHei",serif;color:#fff}
  #wrap{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at center,#284e45 0%,#0b1715 72%)}
  canvas{display:block;width:min(100vw,177.777vh);height:min(56.25vw,100vh);max-width:100vw;max-height:100vh;background:#b9d5c7;box-shadow:0 0 60px #0009;image-rendering:auto}
  #hudHint{display:none}
  #nameInput{position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0}
  #touchControls{display:none;position:absolute;inset:0;z-index:12;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
  .touch-dpad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,clamp(46px,7vw,66px));grid-template-rows:repeat(3,clamp(42px,6.2vw,58px));gap:5px}
  .touch-actions{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,clamp(58px,8.5vw,82px));gap:8px;align-items:end}
  .touch-btn{pointer-events:auto;border:2px solid #ead49a99;background:#153b35c9;color:#fff4cf;border-radius:16px;font:700 clamp(14px,2vw,19px)/1 "Microsoft JhengHei",sans-serif;box-shadow:0 4px 14px #0007;touch-action:none;min-height:44px}
  .touch-btn.is-held{background:#b36a3de6;transform:translateY(2px);box-shadow:0 1px 6px #0008}
  .touch-up{grid-column:2}.touch-left{grid-column:1;grid-row:2}.touch-down{grid-column:2;grid-row:2}.touch-right{grid-column:3;grid-row:2}
  .touch-action{grid-column:2;grid-row:1 / span 2;border-radius:50%;min-height:clamp(92px,13vw,124px);background:#8e473bd9}
  .touch-skill{grid-column:1;grid-row:1}.touch-run{grid-column:1;grid-row:2}.touch-pause{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:48px;height:42px}
  #openingScreen{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#030706;overflow:hidden}
  #openingScreen.is-hidden{display:none}
  #openingVideo{width:100%;height:100%;object-fit:contain;background:#000}
  .opening-btn{position:absolute;border:2px solid #ead49a;background:#173b35e8;color:#fff2c8;border-radius:12px;padding:12px 24px;font:700 18px/1.2 "Microsoft JhengHei",sans-serif;box-shadow:0 5px 18px #0009;cursor:pointer}
  #openingPlay{display:none;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;padding:16px 32px}
  #openingScreen.needs-play #openingPlay{display:block}
  #openingSkip{right:22px;top:20px;background:#102a26c9}
  #rotate{display:none;position:absolute;inset:0;background:#0b1715;z-index:20;place-items:center;text-align:center;padding:30px;font-size:20px;line-height:1.8}
  @media (pointer:coarse),(max-width:1100px){#touchControls{display:block}}
  @media (orientation:portrait){#rotate{display:grid}canvas,#hudHint{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="山水問心：富春江行橫向卷軸遊戲"></canvas>
  <div id="openingScreen" class="needs-play" aria-label="開場影片">
    <video id="openingVideo" src="開頭影片剪.mp4" preload="auto" playsinline></video>
    <button id="openingPlay" class="opening-btn" type="button">播放開場影片</button>
    <button id="openingSkip" class="opening-btn" type="button">略過影片</button>
  </div>
  <input id="nameInput" type="text" maxlength="16" autocomplete="nickname" aria-label="玩家姓名或代號" />
  <div id="hudHint">WASD／方向鍵移動與掌舵　空白鍵斬擊／蓄力／互動　W／S／方向鍵／數字鍵答題　P暫停</div>
  <div id="touchControls" aria-label="行動裝置遊戲控制">
    <div class="touch-dpad">
      <button class="touch-btn touch-up" data-key="arrowup" aria-label="上">▲</button>
      <button class="touch-btn touch-left" data-key="arrowleft" aria-label="左">◀</button>
      <button class="touch-btn touch-down" data-key="arrowdown" aria-label="下">▼</button>
      <button class="touch-btn touch-right" data-key="arrowright" aria-label="右">▶</button>
    </div>
    <div class="touch-actions">
      <button class="touch-btn touch-skill" data-key="l" aria-label="山水清音">清音</button>
      <button class="touch-btn touch-run" data-key="shift">奔跑</button>
      <button class="touch-btn touch-action" data-key=" ">攻擊<br>互動</button>
    </div>
    <button class="touch-btn touch-pause" data-key="p" aria-label="暫停">Ⅱ</button>
  </div>
  <div id="rotate">請將裝置橫向使用<br>以獲得完整的卷軸遊戲體驗</div>
</div>
<script>
(() => {

const openingVideo = document.getElementById('openingVideo');
const openingPlay = document.getElementById('openingPlay');
const openingSkip = document.getElementById('openingSkip');
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r=0){
    const rr = Math.min(Array.isArray(r)?r[0]:r, Math.abs(w)/2, Math.abs(h)/2);
    this.moveTo(x+rr,y); this.arcTo(x+w,y,x+w,y+h,rr);
    this.arcTo(x+w,y+h,x,y+h,rr); this.arcTo(x,y+h,x,y,rr);
    this.arcTo(x,y,x+w,y,rr); this.closePath(); return this;
  };
}
const W = canvas.width, H = canvas.height;
const chapterBackgrounds = [

  'assets/images/fuchun-bg-02-drift.png',
  'assets/images/fuchun-bg-03-clear-fish-v2.png',
  'assets/images/fuchun-sound-valley-v1.png',
  'assets/images/fuchun-bg-04-rapids.png'
].map(src=>{const img=new Image();img.src=src;return img;});
const worldMapSprite=new Image();
worldMapSprite.src='assets/images/fuchun-world-map-concept-v1.png';
const MAP_STAGES=[
  {x:.15,y:.30,title:'第一關　風煙俱淨',subtitle:'霧江啟程・天山共色'},
  {x:.35,y:.70,title:'第二關　從流飄蕩',subtitle:'扁舟入水・任意東西'},
  {x:.61,y:.49,title:'第三關　水皆縹碧',subtitle:'游魚細石・桐廬渡口'},
  {x:.83,y:.49,title:'第四關　寒樹成韻',subtitle:'泉鳥蟬猿・循聲入谷'},
  {x:.83,y:.14,title:'終戰　急湍猛浪',subtitle:'奔浪水獸・決戰瀑谷'}
];
function smoothMapEdge(points,passes=3){
  let edge=points;
  for(let pass=0;pass<passes;pass++){
    const next=[edge[0]];
    for(let i=0;i<edge.length-1;i++){
      const a=edge[i],b=edge[i+1];
      next.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75]);
    }
    next.push(edge[edge.length-1]);edge=next;
  }
  return edge;
}

const MAP_EDGE_B=smoothMapEdge([[.58,0],[.55,.13],[.62,.34],[.56,.52],[.61,.70],[.55,.90],[.54,1]]);

const MAP_EDGE_D=smoothMapEdge([[.73,.48],[.83,.44],[.90,.46],[1,.42]]);

  [MAP_EDGE_A[0],...MAP_EDGE_B,...MAP_EDGE_A.slice().reverse()],
  [MAP_EDGE_B[0],...MAP_EDGE_C_TOP,...MAP_EDGE_C_BOTTOM.slice(1),...MAP_EDGE_B.slice().reverse()],

];
const boatCourseBackground=new Image();
boatCourseBackground.src='assets/images/fuchun-boat-course-v2.png';
const tongluFerryBackground=new Image();
tongluFerryBackground.src='assets/images/tonglu-ferry-wuxia-v1.png';
const heroBoatRearSprite=new Image();
heroBoatRearSprite.src='assets/images/hero-boat-rear.png';

const wuxiaReefAtlas=new Image();
wuxiaReefAtlas.src='assets/images/wuxia-reef-atlas.png';
const fishingWuxiaBackground=new Image();
fishingWuxiaBackground.src='assets/images/wuxia-fishing-bg-v2.png';
const heroSprite=new Image();
heroSprite.src='assets/images/hero-spritesheet.png';
const heroAttackSprite=new Image();
heroAttackSprite.src='assets/images/hero-attack-spritesheet.png';
const enemyAtlasSprite=new Image();
enemyAtlasSprite.src='assets/images/enemy-atlas-ink-v3-simple.png';
const bossRiverSprite=new Image();
bossRiverSprite.src='assets/images/boss-river-beast-ink-v3-simple.png';
const bossLeapSprite=new Image();
bossLeapSprite.src='assets/images/boss-river-beast-leap.png';
const bossDefeatedSprite=new Image();
bossDefeatedSprite.src='assets/images/boss-river-beast-defeated-v1.png';
const RAINBOW_ELIXIR_COLORS=['#ed655d','#efa04c','#e7d35b','#69c77c','#55b9ca','#7582dc','#ad6dc8'];
const ENEMY_ATLAS_FRAMES={
  mist:{col:0,row:0,w:128,h:132},mud:{col:1,row:0,w:132,h:132},
  current:{col:0,row:1,w:154,h:128},shadow:{col:1,row:1,w:128,h:150}
};
const QUIZ_BANK=[
{id:1,chapter:0,type:'文意',q:'「風煙俱淨，天山共色」描寫的是什麼景象？',opts:['狂風吹起濃霧','沒有風，也沒有雲霧，青天與青山同一顏色','炊煙裊裊的村落','天山山脈的雪景'],ans:1,exp:'「俱」是全、都的意思。沒有風，也沒有雲霧，青天與青山同一顏色，呈現開闊澄澈的景象。'},
{id:2,chapter:0,type:'字詞',q:'「自富陽至桐廬，一百許里」中的「許」是什麼意思？',opts:['允許','稱讚','左右、上下（表約略之數）','地名'],ans:2,exp:'「一百許里」即一百里左右，「許」表約數。'},
{id:3,chapter:0,type:'文意',q:'最能總括全文的句子是？',opts:['風煙俱淨，天山共色','從流飄蕩，任意東西','急湍甚箭，猛浪若奔','奇山異水，天下獨絕'],ans:3,exp:'「奇山異水，天下獨絕」總括全文。文章先總述，再分寫山水，第五段寄情於景，第六段補寫光影之趣。'},
{id:4,chapter:1,type:'字詞',q:'「從流飄蕩」中的「從」是什麼意思？',opts:['順著、隨著','從前','僕從','自從'],ans:0,exp:'「從」是順著、隨著的意思。任憑小船隨江流飄蕩，表現悠然閒適的心境。'},
{id:5,chapter:1,type:'字詞',q:'「任意東西」的「東西」在句中的用法是？',opts:['名詞，指物品','方位詞作動詞，指時而向東、時而向西','形容詞，形容船身搖晃','狀聲詞'],ans:1,exp:'「東西」由方位名詞轉作動詞：任憑小船向東或向西，是詞類活用。'},
{id:6,chapter:1,type:'文意',q:'「從流飄蕩，任意東西」流露作者什麼心境？',opts:['迷失方向的慌張','趕路赴任的焦急','隨興自在、悠然閒適','思念家鄉的惆悵'],ans:2,exp:'任憑小船隨江流飄蕩，流露隨興自在、悠然閒適的心境。'},
{id:7,chapter:2,type:'字詞',q:'「水皆縹碧」的「縹碧」是什麼顏色？',opts:['豔紅色','深黑色','金黃色','淡青色'],ans:3,exp:'「縹碧」指淡青色，寫富春江水清澄的色澤。'},
{id:8,chapter:2,type:'修辭',q:'「千丈見底」使用了哪種修辭？',opts:['設問','轉化','誇飾','借代'],ans:2,exp:'江水未必真有千丈深，誇大其辭以強調水的清澈見底。'},
{id:9,chapter:2,type:'文意',q:'「游魚細石，直視無礙」是如何表現水的清澈？',opts:['直接描寫水的顏色','藉水中魚、石清晰可見，從側面襯托','描寫水流的聲音','描寫水面的倒影'],ans:1,exp:'不直說水清，而寫水中景物一覽無遺，是側面描寫的手法。'},
{id:10,chapter:4,type:'字詞',q:'「急湍甚箭」中的「甚」是什麼意思？',opts:['非常','甚至','嚴重','超過、勝過'],ans:3,exp:'「甚箭」即「甚於箭」，湍急的水流比箭還快。'},
{id:11,chapter:4,type:'字詞',q:'「猛浪若奔」的「奔」指的是？',opts:['奔跑的動作','奔馳的馬','逃亡','水花'],ans:1,exp:'「奔」為動詞作名詞用，指奔馬；洶湧的浪如萬馬奔騰。'},
{id:12,chapter:4,type:'修辭',q:'「急湍甚箭，猛浪若奔」主要使用哪些修辭？',opts:['譬喻兼誇飾','設問兼排比','映襯兼借代','頂真兼類疊'],ans:0,exp:'以箭、奔馬作比並加以誇大，與前文靜景「千丈見底」動靜相襯，寫盡「異水」二字。'}
,
{id:13,chapter:0,type:'文意',q:'「風煙俱淨」中的「淨」最能突顯景物的哪項特色？',opts:['澄澈明朗','喧鬧熱烈','幽暗陰森','繁華擁擠'],ans:0,exp:'沒有風，也沒有雲霧，天地顯得澄澈明朗，為全文清麗的山水景色定下基調。'},
{id:14,chapter:0,type:'結構',q:'文章先以「奇山異水，天下獨絕」總述，再分寫山水，這部分採用什麼結構？',opts:['總—分','分—總','因—果','問—答'],ans:0,exp:'先總括富春江山水之奇絕，再分別描寫異水與奇山，屬於總—分結構。'},
{id:15,chapter:1,type:'字詞',q:'「一百許里」與「任意東西」兩句中，哪個詞表示約略數量？',opts:['一百','東西','任意','許'],ans:3,exp:'「許」放在數量詞之後，表示大約、左右。'},
{id:16,chapter:1,type:'文意',q:'作者乘舟「任意東西」，最能表現哪一種遊覽方式？',opts:['依軍令急行','順流隨興而行','逆流競速','靠岸步行'],ans:1,exp:'作者把方向交給水流，乘一葉扁舟隨興遊覽，表現閒適自在。'},
{id:17,chapter:2,type:'描寫',q:'「游魚細石，直視無礙」同時寫了水中哪兩種景物？',opts:['游魚與細石','水草與沙洲','蓮花與竹影','飛鳥與雲霧'],ans:0,exp:'魚與細石都能直接看清，從側面襯托江水清澈。'},
{id:18,chapter:2,type:'文意',q:'「水皆縹碧，千丈見底」主要呈現江水的什麼特色？',opts:['水溫冰冷，水流湍急','水色混濁，河道淺窄','水色淡青，清澈見底','水溫溫暖，水面平靜'],ans:2,exp:'「縹碧」寫水色淡青；「千丈見底」以誇飾強調江水清澈，不能將「千丈」當作實際測得的水深。'},
{id:19,chapter:4,type:'比較',q:'「急湍甚箭」把急流與什麼相比？',opts:['飛箭','飛鳥','奔馬','雷聲'],ans:0,exp:'「甚箭」意指比箭還快，以比較和誇飾突顯水流迅疾。'},
{id:20,chapter:4,type:'文意',q:'「猛浪若奔」中的「若」可解作什麼？',opts:['如果','你','像、如同','及、和'],ans:2,exp:'「若」是像、如同；猛浪好像奔馳的馬群。'},
{id:21,chapter:3,type:'文意',q:'「夾岸高山，皆生寒樹」描寫了什麼環境？',opts:['江面結滿冰層','平原遍植花木','兩岸高山長滿耐寒常綠的樹木','村落炊煙密布'],ans:2,exp:'「夾岸」指水流的兩岸；「寒樹」指耐冷長青的樹木。這兩句描寫兩岸高山上樹木生長的景象。'},
{id:22,chapter:3,type:'字詞',q:'「負勢競上」中的「負」是什麼意思？',opts:['失敗','憑恃、憑藉','欠缺','遭受'],ans:1,exp:'山巒憑藉高峻的地勢爭相向上，形成立體而富動勢的山景。'},
{id:23,chapter:3,type:'修辭',q:'「爭高直指，千百成峰」主要運用哪一種寫法？',opts:['把山峰人格化，寫出競逐向上的姿態','用問句引起思考','以聲音反襯寂靜','用顏色象徵季節'],ans:0,exp:'「爭高」「直指」賦予山峰人的意志與動作，使靜態山勢充滿向上的力量。'},
{id:24,chapter:3,type:'聲音',q:'「泠泠作響」描寫的是哪一種聲音？',opts:['風穿過竹林','猿猴的長嘯','蟬的連續鳴叫','泉水衝擊石頭的清越聲'],ans:3,exp:'「泉水激石，泠泠作響」以清亮的擬聲詞寫泉流撞擊岩石。'},

function tone(freq=440,dur=.08,type='sine',vol=.05){
  if(!audioEnabled) return;
  ensureAudio();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=vol;
  o.connect(g); g.connect(audioCtx.destination);
  const t=audioCtx.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t); o.stop(t+dur);
}
function impactNoise(dur=.055,vol=.045){
  if(!audioEnabled)return;ensureAudio();
  const length=Math.max(1,Math.floor(audioCtx.sampleRate*dur)),buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);
  const source=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain(),t=audioCtx.currentTime;
  source.buffer=buffer;filter.type='lowpass';filter.frequency.value=720;gain.gain.setValueAtTime(vol,t);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);
  source.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);source.start(t);
}
function stopNatureSound(){
  if(natureStopTimer){clearTimeout(natureStopTimer);natureStopTimer=null;}
  if(activeNatureAudio){activeNatureAudio.pause();activeNatureAudio.currentTime=0;activeNatureAudio=null;}
}
function connectNatureAudio(kind,pan){
  if(!natureSpatialAudioEnabled||!audioCtx||audioCtx.state!=='running')return null;
  let node=natureAudioNodes.get(kind);
  if(!node){
    const source=audioCtx.createMediaElementSource(natureAudio[kind]),gain=audioCtx.createGain(),panner=audioCtx.createStereoPanner?audioCtx.createStereoPanner():null;
    source.connect(gain);if(panner){panner.panningModel='equalpower';gain.connect(panner);panner.connect(audioCtx.destination)}else gain.connect(audioCtx.destination);
    node={gain,panner};natureAudioNodes.set(kind,node);
  }
  node.gain.gain.value=1.05;if(node.panner)node.panner.pan.value=pan;
  return node;
}
function playNatureSound(kind,pan=0){
  if(!audioEnabled||!natureAudio[kind])return Promise.resolve(false);
  const audioReady=natureSpatialAudioEnabled?ensureAudio():Promise.resolve(false);stopNatureSound();
  const audio=natureAudio[kind];
  connectNatureAudio(kind,pan);
  audio.muted=false;audio.volume=1;audio.currentTime=0;activeNatureAudio=audio;
  const playback=audio.play();
  return playback.then(async()=>{
    const ready=await audioReady;
    if(ready)connectNatureAudio(kind,pan);
    if(natureAudioNodes.has(kind)&&audioCtx.state!=='running'){stopNatureSound();return false;}
    natureStopTimer=setTimeout(stopNatureSound,4200);return true;
  }).catch(error=>{
    activeNatureAudio=null;console.warn('自然聲音播放失敗',error);return false;
  });
}

  if(name==='bossHeavyHit'){impactNoise(.12,.09);tone(72,.1,'square',.1);setTimeout(()=>tone(38,.2,'sawtooth',.07),22)}
  if(name==='swing'){tone(520,.035,'triangle',.025)}
  if(name==='collect'){tone(660,.08,'sine',.05);setTimeout(()=>tone(880,.1,'sine',.04),55)}
  if(name==='hurt'){tone(110,.12,'sawtooth',.06)}
  if(name==='boss'){tone(65,.35,'square',.07)}

}

function damagePlayer(amount,fromX){
  if(activeQuiz||player.inv>0||player.dash>0||gameState!=='play')return;
  player.charging=0;player.chargeReady=false;
  player.hp-=amount;player.hurt=.35;player.inv=.9;shake=12;flash=.08;sfx('hurt');
  player.x+=fromX<player.x?55:-55;
  combo=0;
  if(player.hp<=0){player.hp=0;gameState='gameover';sfx('gameOver');}
}

function damageEnemy(e,amount,knock=45,hitDir=player.face){
  if(e.dead||e.hurt>0)return;
  const heavy=knock>=80,hitX=e.x+e.w/2,hitY=e.y+e.h/2;
  e.hp-=amount;e.hurt=heavy?.3:.23;e.recoilDir=hitDir;e.hitStrength=heavy?1.45:1;e.x+=hitDir*knock;shake=heavy?10:6;
  inkBurst(hitX,hitY,heavy?18:11);burst(hitX,hitY,heavy?'#f3d88a':'#d8e6d8',heavy?9:5);sfx(heavy?'heavyHit':'hit');
  combo++;comboTimer=2;score+=10*combo;player.spirit=clamp(player.spirit+4,0,player.maxSpirit);
  if(e.hp<=0){e.dead=true;e.death=.65;score+=100;burst(e.x+e.w/2,e.y+20,'#d8cfad',22);}
}

function dispelWaves(hitbox){
  let cleared=0;
  for(const wave of projectiles){
    if(wave.type!=='wave'||wave.life<=0||!rects(hitbox,wave,0))continue;
    wave.life=0;cleared++;burst(wave.x+wave.w/2,wave.y+wave.h/2,'#dff4e8',12);
  }
  if(cleared){score+=cleared*35;shake=Math.max(shake,4);sfx('hit');setMessage(`劍勢破浪！化解 ${cleared} 道攻勢`,1.1);}
  return cleared;
}

function shuffled(items){
  const result=[...items];
  for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}
  return result;
}

function openChapterExam(onComplete){
  if(activeQuiz||examStarted)return;
  examStarted=true;
  const questions=shuffled(QUIZ_BANK.filter(q=>q.chapter===level));
  activeQuiz={mode:'academy',chapter:level,questions,index:0,question:questions[0],onComplete,answered:false,selected:-1,cursor:0,correct:false,feedbackTime:0,correctCount:0,optionRects:[]};
  setQuote('泊舟入學堂，完成六題再啟程。',2.2);
}

function answerQuiz(index){
  if(!activeQuiz||activeQuiz.answered||index<0||index>3)return;
  const q=activeQuiz.question;
  activeQuiz.answered=true;activeQuiz.selected=index;activeQuiz.correct=index===q.ans;
  quizTotal++;
  if(activeQuiz.correct){
    quizCorrect++;activeQuiz.correctCount++;score+=200;sfx('collect');
    activeQuiz.feedbackTime=1.8;
  }else{
    if(!wrongIds.includes(q.id))wrongIds.push(q.id);
    activeQuiz.feedbackTime=3.2;
  }
}

function updateQuiz(dt){
  if(!activeQuiz)return;
  if(!activeQuiz.answered){
    for(let i=0;i<4;i++)if(pressed[String(i+1)]){answerQuiz(i);break;}
    if(activeQuiz&&!activeQuiz.answered&&(pressed['w']||pressed['arrowup']||pressed['arrowleft']))activeQuiz.cursor=(activeQuiz.cursor+3)%4;
    if(activeQuiz&&!activeQuiz.answered&&(pressed['s']||pressed['arrowdown']||pressed['arrowright']))activeQuiz.cursor=(activeQuiz.cursor+1)%4;
    if(activeQuiz&&!activeQuiz.answered&&pressed[' '])answerQuiz(activeQuiz.cursor);
    return;
  }
  activeQuiz.feedbackTime-=dt;
  if(activeQuiz.feedbackTime>0)return;
  if(activeQuiz.index<activeQuiz.questions.length-1){
    activeQuiz.index++;
    activeQuiz.question=activeQuiz.questions[activeQuiz.index];activeQuiz.answered=false;activeQuiz.selected=-1;activeQuiz.cursor=0;activeQuiz.correct=false;activeQuiz.feedbackTime=0;activeQuiz.optionRects=[];
    return;
  }
  const completedExam=activeQuiz,onComplete=completedExam.onComplete;
  activeQuiz=null;paused=false;
  score+=completedExam.correctCount===completedExam.questions.length?500:completedExam.correctCount*40;
  if(completedExam.correctCount===completedExam.questions.length)setQuote('六題全對，獲得「博聞強識」嘉獎！',2.8);
  if(onComplete)onComplete(completedExam.correctCount);
  if(levelClear)transitionTimer=Math.min(transitionTimer,.35);
}

function handleQuizPointer(x,y){
  if(!activeQuiz||activeQuiz.answered)return;
  for(let i=0;i<activeQuiz.optionRects.length;i++){
    const r=activeQuiz.optionRects[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){answerQuiz(i);return;}
  }
}

function hasNearbyInteraction(){
  return objects.some(o=>{
    if(o.type==='gate')return Math.abs(player.x-o.x)<110&&!enemies.some(e=>!e.dead);
    return (o.type==='fish'||o.type==='stone')&&!o.got&&Math.abs(player.x-o.x)<110&&Math.abs(player.y-o.y)<100;
  });
}

function updatePlayer(dt){
  player.anim+=dt;player.step=Math.max(0,player.step-dt);player.hurt=Math.max(0,player.hurt-dt);player.inv=Math.max(0,player.inv-dt);player.dashCd=Math.max(0,player.dashCd-dt);player.skill=Math.max(0,player.skill-dt);
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx--;
  if(keys['d']||keys['arrowright'])dx++;
  if(keys['w']||keys['arrowup'])dy--;
  if(keys['s']||keys['arrowdown'])dy++;
  if(dx&&dy){dx*=.707;dy*=.707}
  if(pressed[' ']&&hasNearbyInteraction()){
    player.interactionLock=true;player.charging=0;player.chargeReady=false;
  }
  if(released[' ']&&player.interactionLock)player.interactionLock=false;
  if(player.attack<=0&&player.hurt<=0){
    if(!player.interactionLock&&pressed[' '])player.charging=Math.max(player.charging,.01);
    if(!player.interactionLock&&keys[' ']){
      player.charging=Math.min(CHARGE_TIME,player.charging+dt);
      if(player.charging>=CHARGE_TIME&&!player.chargeReady){player.chargeReady=true;sfx('collect');setQuote('劍意已滿，放開施展絕招！',1.2);}
    }
    if(!player.interactionLock&&released[' ']&&player.charging>0){
      player.attackCharged=player.chargeReady;
      player.attackMax=player.attackCharged?.56:.4;
      player.attack=player.attackMax;player.attackHit=false;player.attackIndex=(player.attackIndex+1)%3;
      player.charging=0;player.chargeReady=false;sfx('swing');
      if(player.attackCharged){sfx('skill');setQuote('一劍破浪！',1.2);}
    }
    if(player.charging<=0&&pressed['l']&&player.spirit>=35){
      player.spirit-=35;player.skill=.6;shake=10;sfx('skill');let repelled=0;
      for(const e of enemies){
        const dx=e.x+e.w/2-(player.x+player.w/2),dy=e.y+e.h/2-(player.y+player.h/2);
        if(e.dead||e.hurt>0||Math.hypot(dx,dy)>=280)continue;
        damageEnemy(e,22,150,dx>=0?1:-1);e.y=clamp(e.y+(dy>=0?34:-34),350,H-e.h-20);repelled++;
      }
      if(boss&&!boss.dead&&dist(player,boss)<350){const dir=boss.x+boss.w/2>=player.x+player.w/2?1:-1;boss.x=clamp(boss.x+dir*85,40,worldLength-boss.w-40);boss.hp-=35;boss.hurt=.32;boss.hitDir=dir;boss.hitStrength=1.45;inkBurst(boss.x+80,boss.y+80,24);burst(boss.x+80,boss.y+80,'#d9f1e8',10);sfx('bossHeavyHit');repelled++;}
      setQuote(repelled?`山水清音！震退 ${repelled} 隻近身精怪。`:'山水清音蕩開周身濁氣。',1.5);
      for(let i=0;i<32;i++)particle(player.x+30,player.y+40,{color:i%2?'#d9f0da':'#4f887a',vx:rand(-240,240),vy:rand(-220,160),life:rand(.5,1),size:rand(3,10),grav:0});
    }
  }
  if(player.attack>0){
    player.attack-=dt;
    const attackProgress=1-player.attack/player.attackMax;
    const hitWindow=attackProgress>.32&&attackProgress<.72;
    if(hitWindow&&!player.attackHit){
      player.attackHit=true;
      const reach=player.attackCharged?170:110;
      const box={x:player.face>0?player.x+35:player.x-reach+25,y:player.y+8,w:reach,h:78};
      const power=(18+player.attackIndex*3)*(player.attackCharged?2:1);
      dispelWaves(box);
      enemies.forEach(e=>{if(!e.dead&&(!player.attackCharged||isOnScreen(e))&&rects(box,e,4))damageEnemy(e,power,player.attackCharged?90:45)});
      if(boss&&!boss.dead&&(!player.attackCharged||isOnScreen(boss))&&rects(box,boss,10)){boss.hp-=(16+player.attackIndex*3)*(player.attackCharged?2:1);boss.hurt=player.attackCharged?.34:.22;boss.hitDir=player.face;boss.hitStrength=player.attackCharged?1.5:1;shake=player.attackCharged?12:6;inkBurst(box.x+box.w/2,box.y+35,player.attackCharged?20:10);burst(box.x+box.w/2,box.y+35,player.attackCharged?'#f3d88a':'#d9f1e8',player.attackCharged?10:5);sfx(player.attackCharged?'bossHeavyHit':'bossHit');combo++;comboTimer=2;score+=20*combo;player.spirit=clamp(player.spirit+3,0,100);}
      if(player.attackCharged){
        const qiW=190;
        projectiles.push({type:'swordQi',x:player.face>0?player.x+58:player.x-qiW+4,y:player.y+8,vx:player.face*840,vy:0,w:qiW,h:70,life:2.2,damage:32,charged:true,hitTargets:new Set(),hitBoss:false});
      }
    }
    if(player.attack<=0){player.attack=0;player.attackCharged=false;}
  }
  if(player.dash>0){player.dash-=dt;player.x+=player.face*650*dt;for(let i=0;i<2;i++)particle(player.x,player.y+50,{color:'#bfd8ca',vx:-player.face*80,vy:rand(-25,25),life:.25,size:rand(4,12),grav:0});}
  else if(player.hurt<=0){
    const moveSpeed=player.speed*(keys['shift']?1.55:1);
    player.x+=dx*moveSpeed*dt;player.y+=dy*moveSpeed*.72*dt;
    if(dx)player.face=Math.sign(dx);
  }
  player.moving=player.dash>0||!!(dx||dy)&&player.hurt<=0;
  player.running=player.dash>0||player.moving&&!!keys['shift'];
  if(player.moving&&player.dash<=0&&player.step<=0){
    particle(player.x+30-player.face*12,player.y+92,{color:'#cdbf96',vx:-player.face*rand(18,48),vy:rand(-34,-12),life:rand(.18,.3),size:rand(2,5),grav:45});
    player.step=player.running?.1:.17;
  }
  player.x=clamp(player.x,20,worldLength-90);player.y=clamp(player.y,360,585);
  if(comboTimer>0){comboTimer-=dt}else combo=0;
}

function updateEnemies(dt){
  for(const e of enemies){
    const wasHurt=e.hurt>0;e.anim+=dt;e.hurt=Math.max(0,e.hurt-dt);e.cool-=dt;e.stepTimer-=dt;e.moving=false;
    if(e.dead){e.death-=dt;continue;}
    if(wasHurt){e.attack=Math.max(0,e.attack-dt);continue;}
    const dx=player.x-e.x, dy=player.y-e.y;
    const close=Math.abs(dx)<95&&Math.abs(dy)<55;
    e.face=dx>=0?1:-1;
    if(close&&e.cool<=0){e.attack=.42;e.cool=rand(1.0,1.55);}
    if(e.attack>0){
      const prev=e.attack;e.attack-=dt;
      if(prev>.2&&e.attack<=.2&&Math.abs(player.x-e.x)<110&&Math.abs(player.y-e.y)<70)damagePlayer(e.damage,e.x);
    }else if(Math.abs(dx)<520&&Math.abs(dx)>70){
      e.moving=true;e.x+=Math.sign(dx)*e.speed*dt;e.y+=Math.sign(dy)*e.speed*.32*dt;
      if(e.stepTimer<=0){
        const color={mist:'#5d5670',mud:'#9b8460',current:'#76b9ba',shadow:'#3f5a55'}[e.type];
        particle(e.x+e.w/2-e.face*14,e.y+e.h-4,{color,vx:-e.face*rand(18,55),vy:rand(-38,-10),life:rand(.2,.38),size:rand(3,7),grav:35});e.stepTimer=rand(.14,.25);
      }
    }
    if(e.type==='mud'&&Math.abs(dx)<400&&Math.abs(dx)>180&&e.cool<=0){
      projectiles.push({type:'mud',x:e.x+30,y:e.y+28,vx:e.face*260,vy:0,w:22,h:22,life:2.2,damage:8});e.cool=1.8;
    }
  }
  enemies=enemies.filter(e=>!e.dead||e.death>0);
}

function updateProjectiles(dt){
  for(const p of projectiles){
    if(p.life<=0)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.type==='swordQi'){
      const visibleQi=clipToScreen(p);
      if(!visibleQi){p.life=0;continue;}
      dispelWaves(visibleQi);
      const dir=Math.sign(p.vx)||1;
      for(const e of enemies){if(!e.dead&&isOnScreen(e)&&!p.hitTargets.has(e)&&rects(visibleQi,e,4)){p.hitTargets.add(e);damageEnemy(e,p.damage,p.charged?80:38,dir);}}
      if(boss&&!boss.dead&&isOnScreen(boss)&&!boss.hurt&&!p.hitBoss&&rects(visibleQi,boss,8)){p.hitBoss=true;boss.hp-=p.damage;boss.hurt=p.charged?.34:.22;boss.hitDir=dir;boss.hitStrength=p.charged?1.5:1;shake=p.charged?12:6;inkBurst(visibleQi.x+visibleQi.w/2,visibleQi.y+visibleQi.h/2,p.charged?20:10);sfx(p.charged?'bossHeavyHit':'bossHit');}
      continue;
    }
    if(p.type==='wave'){
      p.y+=Math.sin(p.life*8+(p.phase||0))*20*dt;
      if(Math.random()<dt*24)particle(p.x+rand(0,p.w),p.y+rand(2,p.h*.7),{color:Math.random()<.65?'#e8f7ed':'#76b8ad',vx:rand(-80,20),vy:rand(-125,-38),life:rand(.24,.55),size:rand(2,7),grav:115});
    }
    if(rects(p,player,2)){damagePlayer(p.damage,p.x);p.life=0;}
  }
  projectiles=projectiles.filter(p=>p.life>0&&p.x>-200&&p.x<worldLength+200);
}

function updateObjects(dt){
  for(const o of objects){
    if(o.type==='healing'&&!o.got&&player.hp<player.maxHp&&Math.abs(player.x-o.x)<70&&Math.abs(player.y-o.y)<130){
      const recovered=Math.min(o.amount,player.maxHp-player.hp);o.got=true;player.hp+=recovered;score+=80;sfx('collect');setMessage(`服下「${o.idiom}」七彩靈丹，心神恢復 ${Math.ceil(recovered)}`,2.1);
      for(let i=0;i<28;i++)particle(o.x,o.y,{color:RAINBOW_ELIXIR_COLORS[i%RAINBOW_ELIXIR_COLORS.length],vx:rand(-180,180),vy:rand(-220,60),life:rand(.45,1),size:rand(3,8),grav:120});
    }
    if((o.type==='fish'||o.type==='stone')&&!o.got&&pressed[' ']&&Math.abs(player.x-o.x)<110&&Math.abs(player.y-o.y)<100){
      o.seen=true;o.got=true;score+=120;player.spirit=clamp(player.spirit+12,0,100);sfx('collect');setMessage(o.type==='fish'?'你看見清晰游魚：直視無礙':'水底細石清楚可見：千丈見底',2.2);burst(o.x,o.y,o.type==='fish'?'#dbf6e8':'#dac9a6',14);
      if(o.type==='fish'&&!fishingTriggered&&objects.filter(a=>a.type==='fish'&&a.got).length>=3){
        fishingTriggered=true;startFishingGame();
      }
    }
    if(o.type==='gate'&&!levelClear&&Math.abs(player.x-o.x)<100){
      const alive=enemies.some(e=>!e.dead);
      const needObserve=level===2&&objects.filter(a=>a.type==='fish'&&a.got).length<3;
      if(alive)setMessage('前方仍有濁氣阻路',1);
      else if(needObserve)setMessage('再觀察三尾游魚（按空白鍵）',1);
      else if(pressed[' ']||player.x>o.x+15){
        openChapterExam(()=>{levelClear=true;transitionTimer=2.2;sfx('clear');setQuote(level===0?'天山終於共色。':'江水澄明，直視無礙。',2.2);});
      }
    }
  }
}

function startFishingGame(){
  const colors=['#b59655','#668e78','#a76f55','#6d7884','#a8a078'];
  fishing={active:true,hookX:W*.672,hookY:285,anchorX:W*.672,anchorY:H*.267,success:0,attempts:0,flash:0,lastHit:null,carry:null,time:0,
    fish:Array.from({length:8},(_,i)=>({x:rand(80,W-80),baseY:rand(250,H-95),y:0,vx:rand(38,82)*(i%2?1:-1),size:rand(.72,1.22),phase:rand(0,Math.PI*2),color:colors[i%colors.length],hooked:false}))};
  for(const f of fishing.fish)f.y=f.baseY;
  setQuote('水下游魚自在，移動魚鉤，按空白鍵收竿。',2.8);
}

function updateFishing(dt){
  if(!fishing||!fishing.active)return;
  fishing.time+=dt;fishing.flash=Math.max(0,fishing.flash-dt);
  for(const f of fishing.fish){
    if(f.hooked)continue;
    f.x+=f.vx*dt;f.y=f.baseY+Math.sin(fishing.time*1.8+f.phase)*12;
    if(f.vx>0&&f.x>W+65)f.x=-65;
    if(f.vx<0&&f.x<-65)f.x=W+65;
  }
  if(fishing.carry){
    fishing.hookY-=260*dt;fishing.carry.x=fishing.hookX;fishing.carry.y=fishing.hookY+24;
    if(fishing.hookY<=185){
      const caught=fishing.carry;fishing.fish=fishing.fish.filter(f=>f!==caught);fishing.carry=null;fishing.hookY=270;fishing.success++;score+=180;sfx('collect');
      if(fishing.success>=3){fishing.active=false;player.interactionLock=false;score+=500;player.spirit=clamp(player.spirit+25,0,100);setQuote('游魚入簍，清江有情。',2.4);setMessage('完成清江垂釣！',2.2);}
    }
    return;
  }
  const mx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
  const my=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
  fishing.hookX=clamp(fishing.hookX+mx*280*dt,70,W-70);fishing.hookY=clamp(fishing.hookY+my*240*dt,205,H-62);
  if(pressed[' ']){
    fishing.attempts++;
    let nearest=null,best=58;
    for(const f of fishing.fish){const d=Math.hypot(f.x-fishing.hookX,f.y-fishing.hookY);if(d<best){best=d;nearest=f;}}
    fishing.lastHit=!!nearest;fishing.flash=nearest?.32:.18;
    if(nearest){nearest.hooked=true;fishing.carry=nearest;sfx('collect');}else{sfx('swing');}
  }
}

function startSoundGame(){
  const sources=[
    {kind:'spring',x:155,y:505,r:105,label:'泉水激石',verse:'泠泠作響'},
    {kind:'bird',x:1050,y:92,r:100,label:'好鳥相鳴',verse:'嚶嚶成韻'},
    {kind:'cicada',x:825,y:365,r:112,label:'蟬轉不窮',verse:'千轉不窮'},
    {kind:'monkey',x:1155,y:310,r:105,label:'猿叫無絕',verse:'百叫無絕'}
  ];
  soundGame={active:true,sources,order:shuffled([0,1,2,3]),index:0,target:null,found:new Set(),clueDelay:3.5,replayCooldown:0,feedback:'',feedbackTimer:0,correctPending:false,lastChoice:null,time:0,soundLoading:false,soundReady:false,replayRect:{x:W/2-120,y:646,w:240,h:48}};
  soundGame.target=sources[soundGame.order[0]];
}

async function playSoundClue(){
  const g=soundGame;if(!g||!g.active||!g.target||g.soundLoading)return;
  const target=g.target,pan=clamp(target.x/(W/2)-1,-.9,.9);g.soundLoading=true;g.soundReady=false;g.feedback='';
  const played=await playNatureSound(target.kind,pan);
  if(soundGame!==g||!g.active||g.target!==target)return;
  g.soundLoading=false;g.soundReady=played;g.replayCooldown=played?4.2:0;
  if(!played)g.feedback='聲音未能播放，請點擊「播放聲音」或按空白鍵。';
}

function advanceSoundRound(){
  const g=soundGame;g.index++;
  if(g.index>=g.order.length){
    g.active=false;stopNatureSound();sfx('clear');
    openChapterExam(()=>{levelClear=true;transitionTimer=2.4;sfx('clear');setQuote('蟬吟猿嘯，皆入山水清音。',2.8);});
    return;
  }
  g.target=g.sources[g.order[g.index]];g.clueDelay=.7;g.feedback='';g.lastChoice=null;g.soundLoading=false;g.soundReady=false;
}

function updateSoundGame(dt){
  const g=soundGame;if(!g||!g.active)return;g.time+=dt;g.replayCooldown=Math.max(0,g.replayCooldown-dt);
  if(g.feedbackTimer>0){
    g.feedbackTimer-=dt;
    if(g.feedbackTimer<=0){if(g.correctPending)advanceSoundRound();else{g.feedback='';g.lastChoice=null;playSoundClue();}}
    return;
  }
  if(g.soundLoading)return;
  if(g.clueDelay>0){g.clueDelay-=dt;if(g.clueDelay<=0)playSoundClue();return;}
  if(pressed[' ']&&g.replayCooldown<=0)playSoundClue();
}

function handleSoundPointer(x,y){
  const g=soundGame;if(!g||!g.active||g.feedbackTimer>0)return;
  if(g.clueDelay>0)return;
  if(pointInRect(x,y,g.replayRect)){if(g.replayCooldown<=0)playSoundClue();return;}
  if(!g.soundReady)return;
  for(const source of g.sources){
    if(Math.hypot(x-source.x,y-source.y)>source.r)continue;
    g.lastChoice=source;
    if(source===g.target){g.found.add(source.kind);g.feedback=`尋得「${source.label}」——${source.verse}`;g.feedbackTimer=1.55;g.correctPending=true;score+=280;sfx('collect');burst(source.x,source.y,'#f2dc8c',28);}

  if(level===1){drawBoatMode();drawParticles();drawOverlays();return;}
  if(level===3){drawSoundGame();drawParticles();drawOverlays();return;}
  ctx.save();if(shake>1)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBackground();drawObjects();for(const e of enemies)drawEnemy(e);drawProjectiles();if(level===4)drawBoss();drawPlayer();drawParticles();ctx.restore();drawHUD();drawOverlays();
}

function drawTitle(){
  drawBackground();ctx.fillStyle='#07161399';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,125);ctx.fillStyle='#f1e7c8';ctx.strokeStyle='#6b4b2b';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-360,-70,720,160,25);ctx.fill();ctx.stroke();drawText('山水問心',0,-8,68,'center','#173e35','serif',false);drawText('富春江行',0,57,34,'center','#8d4939','serif',false);ctx.restore();
  drawText('《與宋元思書》心境冒險',W/2,270,24,'center','#f7efd7');
  roundRect(110,300,1060,170,20,'#102a26bd','#d8c99677');
  drawWrappedText('富春江行旅，一路奇山異水，也引領作者經歷一場心境轉折的奇妙歷程。世俗的紛擾幻化為精怪，唯有擊敗精怪、跨越阻礙，才能獲得心境上的真正自在。',155,327,970,34,21,'#fff3d4','serif');
  roundRect(W/2-410,478,820,106,16,'#102a2699','#d8c99655');
  drawText('電腦：WASD／方向鍵移動　空白鍵斬擊、蓄力與互動',W/2,502,16,'center','#fff','sans');
  drawText('L／「清音」鍵：施展山水清音，震退身旁精怪',W/2,532,17,'center','#f2dc91','sans');
  drawText('手機／平板：使用畫面方向鍵、攻擊鍵與清音鍵操作',W/2,561,16,'center','#d9e5de','sans');
  const pulse=.72+Math.sin(performance.now()*.005)*.28;ctx.globalAlpha=pulse;drawText('按 Enter 或點擊畫面開始',W/2,615,27,'center','#f1d77b','sans');ctx.globalAlpha=1;
  drawText('單一 HTML 檔，可離線執行',W/2,675,15,'center','#d9e5de','sans');
}

function drawGameOver(){drawPlay();ctx.fillStyle='#0a1210d9';ctx.fillRect(0,0,W,H);drawText(level===1?'扁舟觸礁':'心神耗盡',W/2,270,58,'center','#e9d8b5');drawText(level===1?'調整航線，再渡富春江':'山水之旅尚未結束',W/2,340,24,'center','#fff');drawText('按 R 或點擊畫面重新挑戰本章',W/2,450,26,'center','#f1d77b','sans');}

function drawWorldMapArtwork(){
  if(worldMapSprite.complete&&worldMapSprite.naturalWidth){
    const scale=Math.max(W/worldMapSprite.naturalWidth,H/worldMapSprite.naturalHeight),dw=worldMapSprite.naturalWidth*scale,dh=worldMapSprite.naturalHeight*scale;
    ctx.drawImage(worldMapSprite,(W-dw)/2,(H-dh)/2,dw,dh);
  }else drawBackground();
}

function getMapStagePath(index){
  const points=MAP_STAGE_SHAPES[index].map(([x,y])=>({x:x*W,y:y*H})),path=new Path2D();
  path.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)path.lineTo(points[i].x,points[i].y);
  path.closePath();return path;
}

function drawStageMap(){
  drawWorldMapArtwork();
  ctx.fillStyle='#07171382';ctx.fillRect(0,0,W,H);
  const stageIndex=mapTransition?.stage??level,stage=MAP_STAGES[stageIndex],elapsed=mapTransition?.time??0,flash=elapsed<2.4?.18+.82*Math.sin(elapsed*Math.PI/.8)**2:1,activePath=getMapStagePath(stageIndex);
  for(let i=0;i<MAP_STAGES.length;i++){
    if(i===stageIndex)continue;
    const path=getMapStagePath(i),completed=i<stageIndex;
    if(completed){ctx.save();ctx.clip(path);ctx.filter='brightness(1.27) saturate(1.16)';drawWorldMapArtwork();ctx.globalCompositeOperation='screen';ctx.fillStyle='rgba(225,196,105,.16)';ctx.fillRect(0,0,W,H);ctx.restore();}
    else{ctx.fillStyle='rgba(5,15,13,.18)';ctx.fill(path);}
    ctx.strokeStyle=completed?'rgba(239,215,139,.68)':'rgba(205,191,143,.16)';ctx.lineWidth=completed?2.6:1.2;ctx.lineJoin='round';ctx.stroke(path);
  }
  ctx.save();ctx.clip(activePath);ctx.globalAlpha=.3+.7*flash;ctx.filter=`brightness(${1.12+flash*.28}) saturate(${1.05+flash*.25})`;drawWorldMapArtwork();ctx.restore();
  ctx.save();ctx.globalAlpha=.35+.65*flash;ctx.globalCompositeOperation='screen';ctx.fillStyle='rgba(121,207,179,.25)';ctx.shadowColor='#f4dc84';ctx.shadowBlur=18+flash*30;ctx.fill(activePath);ctx.strokeStyle='#f7df8a';ctx.lineWidth=2.5+flash*3;ctx.lineJoin='round';ctx.stroke(activePath);ctx.restore();
  for(let i=0;i<MAP_STAGES.length;i++){
    const node=MAP_STAGES[i],active=i===stageIndex,completed=i<stageIndex,nx=node.x*W,ny=node.y*H;
    ctx.save();ctx.globalAlpha=active?.35+.65*flash:1;ctx.shadowColor=active||completed?'#f7d978':'#0a1714';ctx.shadowBlur=active?12+flash*18:completed?14:7;ctx.fillStyle=active?'#a64e35':completed?'#b38c43':'#183b34cc';ctx.strokeStyle=active?'#ffe58f':completed?'#f8e6a5':'#d1c18a99';ctx.lineWidth=active?4:completed?3:2;ctx.beginPath();ctx.arc(nx,ny,active?25:completed?21:18,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
    drawText(String(i+1),nx,ny+(active?1:0),active?20:completed?17:15,'center',active?`rgba(255,242,189,${.35+.65*flash})`:completed?'#fff3bd':'#ded5b9','sans',false);
  }
  roundRect(W/2-360,566,720,125,20,'#102a26e8','#d9c47f');
  drawText('富春江行旅圖',W/2,45,32,'center','#fff0bd','serif');
  drawText(stage.title,W/2,596,28,'center','#f7df91','serif',false);
  drawText(stage.subtitle,W/2,632,19,'center','#e8eee2','sans',false);
  drawText('區域即將展開　按 Enter／空白鍵或點擊略過',W/2,668,15,'center','#b9cec3','sans',false);
}

function drawVictoryCelebration(){
  drawPlay();
  const t=performance.now()/1000;
  ctx.fillStyle='#06171380';ctx.fillRect(0,0,W,H);
  ctx.save();
  for(let i=0;i<42;i++){
    const x=(i*137+t*(22+i%5*5))%(W+80)-40,y=(i*83+t*(32+i%4*8))%(H+120)-60;
    ctx.save();ctx.translate(x,y);ctx.rotate(t*(.5+i%3*.2)+i);ctx.globalAlpha=.45+(i%4)*.12;ctx.fillStyle=i%3===0?'#f5df82':i%3===1?'#d89055':'#b9dfca';ctx.fillRect(-3,-8,6,16);ctx.restore();
  }
  ctx.restore();
  const glow=.72+Math.sin(t*3)*.12;
  ctx.save();ctx.shadowColor='#f4d66d';ctx.shadowBlur=30*glow;ctx.fillStyle='#9c3f32';ctx.strokeStyle='#f2d77b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,142,72,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
  drawText('過關',W/2,142,43,'center','#fff1bd','serif',false);
  roundRect(W/2-390,232,780,300,24,'#efe5cedf','#d8bd70');
  drawText('破浪伏魔・富春歸澄',W/2,287,48,'center','#73402f','serif',false);
  drawText('奔浪水獸已伏，急湍止息，濁氣盡散。',W/2,356,24,'center','#334f45','serif',false);
  drawText('富春江重現清明，奇山異水盡入心中。',W/2,400,24,'center','#334f45','serif',false);
  drawText(`本次悟境 ${score}　・　行旅領悟 ${collected.length}`,W/2,469,22,'center','#8d4939','sans',false);
  const button=CELEBRATION_UI.continue,pulse=.86+Math.sin(t*4)*.08;
  ctx.save();ctx.globalAlpha=pulse;roundRect(button.x,button.y,button.w,button.h,14,'#8e4937','#f0d98e');ctx.restore();
  drawText('查看遊歷成果',W/2,button.y+29,23,'center','#fff7dc','sans',false);
  drawText('按 Enter 或點選按鈕繼續',W/2,670,17,'center','#f5e9c8','sans');
}

function drawEnding(){
  drawBackground();ctx.fillStyle='#07161388';ctx.fillRect(0,0,W,H);
  drawText('富春江重現清明',W/2,55,42,'center','#f4e6bd');
  roundRect(45,95,535,575,22,'#efe5ceeF','#6a5336');
  roundRect(600,95,635,575,22,'#102a26e8','#d8c99688');

  drawText('本次遊歷',312,130,26,'center','#254b40','serif',false);
  drawText(`悟境 ${score}`,312,185,40,'center','#8e483b','serif',false);
  drawText(`答題：對 ${quizCorrect}／共 ${quizTotal}　行旅領悟：${collected.length}`,312,238,20,'center','#3d5c52','sans',false);
  drawText('急湍止息，濁霧消散；心中亦復清明。',312,282,19,'center','#5d5545','serif',false);
  drawText('留下姓名或代號',ENDING_UI.input.x,320,18,'left','#254b40','sans',false);
  ctx.lineWidth=document.activeElement===nameInput?4:2;
  roundRect(ENDING_UI.input.x,ENDING_UI.input.y,ENDING_UI.input.w,ENDING_UI.input.h,12,'#fffaf0',document.activeElement===nameInput?'#2f6a4e':'#8b795b');
  const shownName=leaderboard.name||'點這裡輸入（1–16 字）';
  drawText(shownName,ENDING_UI.input.x+18,ENDING_UI.input.y+29,21,'left',leaderboard.name?'#253b34':'#988d78','sans',false);
  if(document.activeElement===nameInput&&!leaderboard.submitted&&Math.floor(performance.now()/500)%2===0){
    ctx.save();ctx.font='21px "Microsoft JhengHei",sans-serif';const caretX=ENDING_UI.input.x+20+ctx.measureText(leaderboard.name).width;ctx.strokeStyle='#254b40';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(caretX,ENDING_UI.input.y+17);ctx.lineTo(caretX,ENDING_UI.input.y+42);ctx.stroke();ctx.restore();
  }
  const submitFill=leaderboard.submitted?'#587c64':leaderboard.submitting?'#8a866f':'#254b40';
  roundRect(ENDING_UI.submit.x,ENDING_UI.submit.y,ENDING_UI.submit.w,ENDING_UI.submit.h,12,submitFill,'#d8c996');
  drawText(leaderboard.submitted?'已加入排名':leaderboard.submitting?'正在儲存…':'加入本機排名',312,ENDING_UI.submit.y+27,22,'center','#fff','sans',false);
  if(leaderboard.error)drawText(leaderboard.error,312,510,17,'center','#9b3f35','sans',false);
  else if(leaderboard.message)drawText(leaderboard.message,312,510,18,'center','#2f6a4e','sans',false);
  else drawText('輸入後按 Enter 或點擊加入本機排名',312,510,16,'center','#716957','sans',false);
  drawText('每章完成六題小學堂；分數亦來自戰鬥與探索',312,550,16,'center','#716957','sans',false);
  roundRect(ENDING_UI.restart.x,ENDING_UI.restart.y,ENDING_UI.restart.w,ENDING_UI.restart.h,10,'#d8c996','#6a5336');
  drawText('再次遊歷富春江',312,ENDING_UI.restart.y+21,18,'center','#254b40','sans',false);

  drawText('本機悟境排行榜',918,130,27,'center','#f4e6bd','serif',false);
  drawText('名次',630,164,15,'left','#b9cbbf','sans',false);drawText('姓名／代號',690,164,15,'left','#b9cbbf','sans',false);drawText('答對',1080,164,15,'right','#b9cbbf','sans',false);drawText('悟境',1200,164,15,'right','#b9cbbf','sans',false);
  if(!leaderboard.rows.length)drawText(leaderboard.error||'尚無本機成績，等你留下第一筆！',918,350,19,'center','#d8e8d8','sans',false);
  else leaderboard.rows.forEach((row,i)=>{
    const y=190+i*43;roundRect(620,y-16,595,36,8,i%2?'#f3ead511':'#f3ead51c');
    const rankColor=i===0?'#f1d77b':i===1?'#d9e0dd':i===2?'#c88f65':'#d8e8d8';
    drawText(String(i+1),650,y,19,'center',rankColor,'sans',false);
    drawText(row.player_name,690,y,18,'left','#f7efd7','sans',false);
    drawText(`${row.quiz_correct}/${row.quiz_total}`,1080,y,16,'right','#b9cbbf','sans',false);
    drawText(String(row.score),1200,y,20,'right',rankColor,'sans',false);
  });
  drawText('僅儲存在此裝置；依悟境排序，同分時依答對題數',918,646,15,'center','#9fb5aa','sans',false);
}

function render(){ctx.clearRect(0,0,W,H);if(gameState==='title')drawTitle();else if(gameState==='map')drawStageMap();else if(gameState==='play')drawPlay();else if(gameState==='gameover')drawGameOver();else if(gameState==='celebration')drawVictoryCelebration();else if(gameState==='ending')drawEnding();}

function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(gameState==='title'&&(pressed['enter']||pressed['mouse'])){gameState='play';resetGame();}
  if(gameState==='gameover'&&pressed['r']){gameState='play';startLevel(level);}
  if(gameState==='celebration'&&pressed['enter'])startLevel(5);
  if(gameState==='ending'&&pressed['enter']&&leaderboard.submitted)restartFromEnding();
  update(dt);render();pressed=Object.create(null);released=Object.create(null);requestAnimationFrame(loop);
}
canvas.addEventListener('pointerdown',e=>{
  if(openingActive)return;
  ensureAudio();
  if(level!==3)playBackgroundMusic();
  const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(activeQuiz){handleQuizPointer(x,y);return;}
  if(soundGame&&soundGame.active){handleSoundPointer(x,y);return;}
  if(gameState==='gameover'){gameState='play';startLevel(level);return;}
  if(gameState==='celebration'){handleCelebrationPointer(x,y);return;}
  if(gameState==='ending'){handleEndingPointer(x,y);return;}
  pressed['mouse']=true;if(gameState==='title'){gameState='play';resetGame();}
});
function setVirtualKey(button,key,down,pointerId){
  if(openingActive)return;
  ensureAudio();
  if(level!==3)playBackgroundMusic();
  if(down){
    if(soundGame&&soundGame.active&&key===' '&&soundGame.clueDelay<=0&&soundGame.replayCooldown<=0)playSoundClue();
    if(gameState==='title'){gameState='play';resetGame();}
    if(gameState==='gameover'){gameState='play';startLevel(level);return;}
    if(!keys[key])pressed[key]=true;keys[key]=true;button.classList.add('is-held');
    if(pointerId!==undefined&&button.setPointerCapture)button.setPointerCapture(pointerId);
  }else{
    if(keys[key])released[key]=true;keys[key]=false;button.classList.remove('is-held');
  }
}
for(const button of touchControls.querySelectorAll('[data-key]')){
  const key=button.dataset.key;
  button.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setVirtualKey(button,key,true,e.pointerId);});
  button.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();setVirtualKey(button,key,false);});
  button.addEventListener('pointercancel',e=>setVirtualKey(button,key,false));
  button.addEventListener('contextmenu',e=>e.preventDefault());
}
requestAnimationFrame(loop);
})();
</script>
