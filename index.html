function ensureAudio(){
  if(!audioEnabled) return;
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq=440,dur=.08,type='sine',vol=.05){
  if(!audioEnabled) return;
  ensureAudio();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq; g.gain.value=vol;
  o.connect(g); g.connect(audioCtx.destination);
  const t=audioCtx.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t); o.stop(t+dur);
}

async function loadLeaderboard(){
  if(!leaderboardConfigured()){leaderboard.error='排行榜尚未連線';return;}
  leaderboard.loading=true;leaderboard.error='';
  try{
    const query='select=player_name,score,quiz_correct,quiz_total,seals,created_at&order=score.desc,quiz_correct.desc,created_at.asc&limit=10';
    const response=await fetch(`${SUPABASE_URL}/rest/v1/game_scores?${query}`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY}});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    leaderboard.rows=await response.json();
  }catch(error){
    leaderboard.error='暫時無法讀取排行榜';
  }finally{leaderboard.loading=false;}
}

function damagePlayer(amount,fromX){
  if(activeQuiz||player.inv>0||player.dash>0||gameState!=='play')return;
  player.charging=0;player.chargeReady=false;
  player.hp-=amount;player.hurt=.35;player.inv=.9;shake=12;flash=.08;sfx('hurt');
  player.x+=fromX<player.x?55:-55;
  combo=0;
  if(player.hp<=0){player.hp=0;gameState='gameover';}
}

function damageEnemy(e,amount,knock=45){
  if(e.dead||e.hurt>0)return;
  e.hp-=amount;e.hurt=.18;e.x+=player.face*knock;shake=6;inkBurst(e.x+e.w/2,e.y+e.h/2,10);sfx('hit');
  combo++;comboTimer=2;score+=10*combo;player.spirit=clamp(player.spirit+4,0,player.maxSpirit);
  if(e.hp<=0){e.dead=true;e.death=.55;score+=100;burst(e.x+e.w/2,e.y+20,'#d8cfad',18);}
}

function pickQuiz(chapter,excludeId=null){
  const pool=QUIZ_BANK.filter(q=>q.chapter===chapter);
  const used=quizUsedByChapter[chapter];
  let available=pool.filter(q=>!used.has(q.id));
  if(!available.length){used.clear();available=pool.filter(q=>q.id!==excludeId);}
  const question=available[Math.floor(Math.random()*available.length)];
  used.add(question.id);
  return question;
}

function openSealQuiz(seal){

  activeQuiz.answered=true;activeQuiz.selected=index;activeQuiz.correct=index===q.ans;
  quizTotal++;
  if(activeQuiz.correct){
    quizCorrect++;
    if(activeQuiz.mode==='seal'){
      const seal=activeQuiz.seal;seal.got=true;collected.push(seal.text);
      if(!seal.quizHadWrong){score+=300;player.spirit=clamp(player.spirit+30,0,100);}
      sfx('collect');setQuote('獲得山水印記：'+seal.text,2.6);burst(seal.x,seal.y,'#f5d77a',24);
    }else if(activeQuiz.onCorrect){activeQuiz.onCorrect();}
    activeQuiz.feedbackTime=2.5;
  }else{
    if(!wrongIds.includes(q.id))wrongIds.push(q.id);
    if(activeQuiz.mode==='seal')activeQuiz.seal.quizHadWrong=true;
    activeQuiz.feedbackTime=4;
  }
}

function updateQuiz(dt){
  if(!activeQuiz)return;
  if(!activeQuiz.answered){
    for(let i=0;i<4;i++)if(pressed[String(i+1)]){answerQuiz(i);break;}
    return;
  }
  activeQuiz.feedbackTime-=dt;
  if(activeQuiz.feedbackTime>0)return;
  if(activeQuiz.correct){activeQuiz=null;return;}
  if(activeQuiz.mode==='seal'){
    activeQuiz.seal.quizCooldown=10;activeQuiz=null;return;
  }
  activeQuiz.question=pickQuiz(activeQuiz.chapter,activeQuiz.question.id);activeQuiz.answered=false;activeQuiz.selected=-1;activeQuiz.correct=false;activeQuiz.feedbackTime=0;activeQuiz.optionRects=[];
}

function handleQuizPointer(x,y){
  if(!activeQuiz||activeQuiz.answered)return;
  for(let i=0;i<activeQuiz.optionRects.length;i++){
    const r=activeQuiz.optionRects[i];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){answerQuiz(i);return;}
  }
}

function hasNearbyInteraction(){
  return objects.some(o=>{
    if(o.type==='gate')return Math.abs(player.x-o.x)<110&&!enemies.some(e=>!e.dead);
    return (o.type==='fish'||o.type==='stone')&&!o.got&&Math.abs(player.x-o.x)<110&&Math.abs(player.y-o.y)<100;
  });
}

function updatePlayer(dt){
  player.anim+=dt;player.hurt=Math.max(0,player.hurt-dt);player.inv=Math.max(0,player.inv-dt);player.dashCd=Math.max(0,player.dashCd-dt);player.skill=Math.max(0,player.skill-dt);
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx--;
  if(keys['d']||keys['arrowright'])dx++;
  if(keys['w']||keys['arrowup'])dy--;
  if(keys['s']||keys['arrowdown'])dy++;
  if(dx&&dy){dx*=.707;dy*=.707}
  if(pressed['j']&&hasNearbyInteraction()){
    player.interactionLock=true;player.charging=0;player.chargeReady=false;
  }
  if(released['j']&&player.interactionLock)player.interactionLock=false;
  if(player.attack<=0&&player.hurt<=0){
    if(!player.interactionLock&&pressed['j'])player.charging=Math.max(player.charging,.01);
    if(!player.interactionLock&&keys['j']){
      player.charging=Math.min(CHARGE_TIME,player.charging+dt);
      if(player.charging>=CHARGE_TIME&&!player.chargeReady){player.chargeReady=true;sfx('collect');setQuote('劍意已滿，放開施展絕招！',1.2);}
    }
    if(!player.interactionLock&&released['j']&&player.charging>0){
      player.attackCharged=player.chargeReady;
      player.attackMax=player.attackCharged?.56:.4;
      player.attack=player.attackMax;player.attackHit=false;player.attackIndex=(player.attackIndex+1)%3;
      player.charging=0;player.chargeReady=false;sfx('swing');
      if(player.attackCharged){sfx('skill');setQuote('一劍破浪！',1.2);}
    }
    if(player.charging<=0&&pressed['l']&&player.spirit>=35){
      player.spirit-=35;player.skill=.6;shake=10;sfx('skill');setQuote('山水清音！',1.2);
      enemies.forEach(e=>{if(!e.dead&&dist(player,e)<260)damageEnemy(e,28,80)});
      if(boss&&!boss.dead&&dist(player,boss)<350){boss.hp-=35;boss.hurt=.25;inkBurst(boss.x+80,boss.y+80,24);}
      for(let i=0;i<32;i++)particle(player.x+30,player.y+40,{color:i%2?'#d9f0da':'#4f887a',vx:rand(-240,240),vy:rand(-220,160),life:rand(.5,1),size:rand(3,10),grav:0});
    }
  }
  if(player.attack>0){
    player.attack-=dt;
    const attackProgress=1-player.attack/player.attackMax;
    const hitWindow=attackProgress>.32&&attackProgress<.72;
    if(hitWindow&&!player.attackHit){
      player.attackHit=true;
      const reach=player.attackCharged?170:110;
      const box={x:player.face>0?player.x+35:player.x-reach+25,y:player.y+8,w:reach,h:78};
      const power=(18+player.attackIndex*3)*(player.attackCharged?2:1);
      enemies.forEach(e=>{if(!e.dead&&rects(box,e,4))damageEnemy(e,power,player.attackCharged?90:45)});
      if(boss&&!boss.dead&&rects(box,boss,10)){boss.hp-=(16+player.attackIndex*3)*(player.attackCharged?2:1);boss.hurt=player.attackCharged?.3:.16;shake=player.attackCharged?11:5;inkBurst(box.x+box.w/2,box.y+35,player.attackCharged?18:8);sfx('hit');combo++;comboTimer=2;score+=20*combo;player.spirit=clamp(player.spirit+3,0,100);}
    }
    if(player.attack<=0){player.attack=0;player.attackCharged=false;}
  }
  if(player.dash>0){player.dash-=dt;player.x+=player.face*650*dt;for(let i=0;i<2;i++)particle(player.x,player.y+50,{color:'#bfd8ca',vx:-player.face*80,vy:rand(-25,25),life:.25,size:rand(4,12),grav:0});}
  else if(player.hurt<=0){
    const moveSpeed=player.speed*(keys['shift']?1.55:1);
    player.x+=dx*moveSpeed*dt;player.y+=dy*moveSpeed*.72*dt;
    if(dx)player.face=Math.sign(dx);
  }
  player.moving=player.dash>0||!!(dx||dy)&&player.hurt<=0;
  player.running=player.dash>0||player.moving&&!!keys['shift'];
  player.x=clamp(player.x,20,worldLength-90);player.y=clamp(player.y,360,585);
  if(comboTimer>0){comboTimer-=dt}else combo=0;
}

function updateEnemies(dt){
  for(const e of enemies){
    e.anim+=dt;e.hurt=Math.max(0,e.hurt-dt);e.cool-=dt;
    if(e.dead){e.death-=dt;continue;}
    const dx=player.x-e.x, dy=player.y-e.y;
    const close=Math.abs(dx)<95&&Math.abs(dy)<55;
    e.face=dx>=0?1:-1;
    if(close&&e.cool<=0){e.attack=.42;e.cool=rand(1.0,1.55);}
    if(e.attack>0){
      const prev=e.attack;e.attack-=dt;
      if(prev>.2&&e.attack<=.2&&Math.abs(player.x-e.x)<110&&Math.abs(player.y-e.y)<70)damagePlayer(e.damage,e.x);
    }else if(Math.abs(dx)<520&&Math.abs(dx)>70){
      e.x+=Math.sign(dx)*e.speed*dt;e.y+=Math.sign(dy)*e.speed*.32*dt;
    }
    if(e.type==='mud'&&Math.abs(dx)<400&&Math.abs(dx)>180&&e.cool<=0){
      projectiles.push({type:'mud',x:e.x+30,y:e.y+28,vx:e.face*260,vy:0,w:22,h:22,life:2.2,damage:8});e.cool=1.8;
    }
  }
  enemies=enemies.filter(e=>!e.dead||e.death>0);
}

function updateProjectiles(dt){
  for(const p of projectiles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.type==='wave'){p.y+=Math.sin(p.life*8)*20*dt;}
    if(rects(p,player,2)){damagePlayer(p.damage,p.x);p.life=0;}
  }
  projectiles=projectiles.filter(p=>p.life>0&&p.x>-200&&p.x<worldLength+200);
}

function updateObjects(dt){
  for(const o of objects){
    if(o.type==='seal'){
      o.quizCooldown=Math.max(0,(o.quizCooldown||0)-dt);
      if(!o.got&&o.quizCooldown<=0&&Math.abs(player.x-o.x)<70&&Math.abs(player.y-o.y)<90&&!activeQuiz){openSealQuiz(o);break;}
    }
    if((o.type==='fish'||o.type==='stone')&&!o.got&&pressed['j']&&Math.abs(player.x-o.x)<110&&Math.abs(player.y-o.y)<100){

      if(alive)setMessage('前方仍有濁氣阻路',1);

        openGateQuiz(()=>{levelClear=true;transitionTimer=2.2;sfx('clear');setQuote(level===0?'天山終於共色。':'江水澄明，直視無礙。',2.2);});
      }
    }
  }
}

function updateFishing(dt){
  if(!fishing||!fishing.active)return;
  fishing.time+=dt;fishing.flash=Math.max(0,fishing.flash-dt);
  for(const f of fishing.fish){
    if(f.hooked)continue;
    f.x+=f.vx*dt;f.y=f.baseY+Math.sin(fishing.time*1.8+f.phase)*12;
    if(f.vx>0&&f.x>W+65)f.x=-65;
    if(f.vx<0&&f.x<-65)f.x=W+65;
  }
  if(fishing.carry){
    fishing.hookY-=260*dt;fishing.carry.x=fishing.hookX;fishing.carry.y=fishing.hookY+24;
    if(fishing.hookY<=185){
      const caught=fishing.carry;fishing.fish=fishing.fish.filter(f=>f!==caught);fishing.carry=null;fishing.hookY=270;fishing.success++;score+=180;sfx('collect');
      if(fishing.success>=3){fishing.active=false;player.interactionLock=false;score+=500;player.spirit=clamp(player.spirit+25,0,100);setQuote('游魚入簍，清江有情。',2.4);setMessage('完成清江垂釣！',2.2);}
    }
    return;
  }
  const mx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
  const my=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
  fishing.hookX=clamp(fishing.hookX+mx*280*dt,70,W-70);fishing.hookY=clamp(fishing.hookY+my*240*dt,205,H-62);
  if(pressed['j']){
    fishing.attempts++;
    let nearest=null,best=58;
    for(const f of fishing.fish){const d=Math.hypot(f.x-fishing.hookX,f.y-fishing.hookY);if(d<best){best=d;nearest=f;}}
    fishing.lastHit=!!nearest;fishing.flash=nearest?.32:.18;
    if(nearest){nearest.hooked=true;fishing.carry=nearest;sfx('collect');}else{sfx('swing');}
  }
}

function drawWrappedText(text,x,y,maxWidth,lineHeight,size=22,color='#254b40',font='sans'){
  ctx.save();ctx.font=`${size}px ${font==='sans'?'"Microsoft JhengHei",sans-serif':'"Noto Serif TC","Microsoft JhengHei",serif'}`;ctx.fillStyle=color;ctx.textAlign='left';ctx.textBaseline='top';
  let line='',lineY=y;
  for(const char of text){
    const test=line+char;
    if(line&&ctx.measureText(test).width>maxWidth){ctx.fillText(line,x,lineY);line=char;lineY+=lineHeight;}else line=test;
  }
  if(line)ctx.fillText(line,x,lineY);
  ctx.restore();return lineY+lineHeight;
}

function drawSwordQi(p,sy){

  if(p.attackCharged){
    const glow=ctx.createLinearGradient(20,sy+55,205,sy+8);glow.addColorStop(0,'#f1d06a22');glow.addColorStop(.42,'#f5dc83dd');glow.addColorStop(1,'#bff6e8aa');
    ctx.strokeStyle=glow;ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(18,sy+65);ctx.bezierCurveTo(64,sy-22,150,sy-38,210,sy+12);ctx.stroke();
    ctx.strokeStyle='#eafbe8';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(24,sy+62);ctx.bezierCurveTo(76,sy-12,148,sy-25,203,sy+10);ctx.stroke();
    ctx.globalAlpha=pulse*.72;ctx.strokeStyle='#2d6258';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,sy+76);ctx.bezierCurveTo(82,sy+8,157,sy-8,218,sy+30);ctx.stroke();
    for(let i=0;i<8;i++){
      const x=60+i*20+progress*16,y=sy+18+Math.sin(i*1.7)*20;
      ctx.fillStyle=i%2?'#f4d878':'#c7eee1';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-12-i,y+5);ctx.lineTo(x-4,y-5);ctx.fill();
    }
  }else{
    const edge=ctx.createLinearGradient(18,sy+60,138,sy+10);edge.addColorStop(0,'#6ba69422');edge.addColorStop(.55,'#c8f1e3dd');edge.addColorStop(1,'#f5f1d5aa');
    ctx.strokeStyle=edge;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(20,sy+62);ctx.quadraticCurveTo(76,sy-5,142,sy+18);ctx.stroke();
    ctx.strokeStyle='#eff9e9';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(28,sy+59);ctx.quadraticCurveTo(80,sy+2,136,sy+18);ctx.stroke();
    ctx.globalAlpha=pulse*.55;ctx.strokeStyle='#315f54';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(14,sy+70);ctx.quadraticCurveTo(74,sy+10,148,sy+28);ctx.stroke();
  }

}
function drawPlayer(){

    let frame=0,sourceY=0,drawH=150,drawY=sy+105-drawH;
    const attacking=p.attack>0&&heroAttackSprite.complete&&heroAttackSprite.naturalWidth;
    if(attacking){
      sprite=heroAttackSprite;frameW=sprite.naturalWidth/4;frameH=sprite.naturalHeight;
      const progress=clamp(1-p.attack/p.attackMax,0,.999);
      frame=Math.min(p.attackCharged?3:2,Math.floor(progress*(p.attackCharged?4:3)));
      drawH=170;drawY=sy+98-drawH*.74;
    }else{
      const running=p.running||p.dash>0;

    ctx.save();ctx.translate(sx+30,0);ctx.scale(p.face,1);

    ctx.drawImage(sprite,frame*frameW,sourceY,frameW,frameH,-drawW/2,drawY,drawW,drawH);

  // robe

  if(atk){ctx.strokeStyle='#ecf0dfaa';ctx.lineWidth=10;ctx.beginPath();ctx.arc(20,-2,72,-.7,.45);ctx.stroke();}
  if(p.skill>0){ctx.strokeStyle='#d9f5d6';ctx.lineWidth=4;ctx.globalAlpha=p.skill/.6;ctx.beginPath();ctx.arc(0,15,75+(1-p.skill/.6)*80,0,Math.PI*2);ctx.stroke();}

  roundRect(24,20,530,86,18,'#102a26d9','#d8c99688');drawText('清江垂釣',48,49,28,'left','#f6eccd');drawText('WASD／方向鍵移動魚鉤　J 收竿',48,82,18,'left','#d8e8dc','sans');
  roundRect(W-280,20,256,86,18,'#102a26d9','#d8c99688');drawText(`漁獲 ${fishing.success}／3`,W-50,49,24,'right','#f5d979','sans');drawText(`收竿 ${fishing.attempts} 次`,W-50,81,17,'right','#d8e8dc','sans');
  if(fishing.flash>0){ctx.globalAlpha=fishing.flash/.32*.22;ctx.fillStyle=fishing.lastHit?'#d9f4d2':'#cf6253';ctx.fillRect(0,133,W,H-133);}
  ctx.restore();
}

function drawQuizPanel(){
  if(!activeQuiz)return;
  const aq=activeQuiz,q=aq.question;
  ctx.save();ctx.fillStyle='#07130fd9';ctx.fillRect(0,0,W,H);ctx.lineWidth=4;
  roundRect(110,24,1060,672,24,'#efe4c9','#254b40');
  drawText(aq.mode==='seal'?'山水印記·理解考驗':'章末閤門·理解考驗',W/2,68,32,'center','#254b40','serif',false);
  drawText(`【${q.type}】`,150,112,20,'left','#8b4c3e','sans',false);
  drawWrappedText(q.q,150,138,980,32,25,'#263f37','serif');
  aq.optionRects=[];
  for(let i=0;i<4;i++){
    const r={x:150,y:205+i*72,w:980,h:58};aq.optionRects.push(r);
    let fill='#f8f1df',stroke='#607b6d';
    if(aq.answered&&i===q.ans){fill='#d7e8d4';stroke='#2f6a4e';}
    if(aq.answered&&!aq.correct&&i===aq.selected){fill='#ead4cc';stroke='#954f43';}
    ctx.lineWidth=2;roundRect(r.x,r.y,r.w,r.h,12,fill,stroke);
    drawText(`${i+1}. ${q.opts[i]}`,r.x+22,r.y+r.h/2,21,'left','#263f37','sans',false);
  }
  if(!aq.answered){
    drawText('按數字鍵 1–4 或點選答案',W/2,653,20,'center','#536a60','sans',false);
  }else{
    const result=aq.correct?'答對了！':`答錯了，正解：${q.opts[q.ans]}`;
    drawText(result,150,531,23,'left',aq.correct?'#2f6a4e':'#954f43','sans',false);
    drawWrappedText(`詳解：${q.exp}`,150,558,980,27,19,'#384d45','sans');
    if(!aq.correct)drawText(aq.mode==='seal'?'印記保留原地，10 秒後可重試':'詳解結束後自動更換一題',W/2,665,18,'center','#7b5547','sans',false);
  }
  ctx.restore();
}

function drawOverlays(){
  if(chapterTimer>0){const a=clamp(chapterTimer<.5?chapterTimer*2:chapterTimer>2.7?(3.2-chapterTimer)*2:1,0,1);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#0d211ecf';ctx.fillRect(0,210,W,180);drawText(chapterTitle,W/2,270,44,'center','#f0e4bd');drawText(chapterSub,W/2,335,22,'center','#d2e2d6','sans');ctx.restore();}
  if(quoteTimer>0){roundRect(W/2-340,H-128,680,58,14,'#10241fd9','#d8c99666');drawText(currentQuote,W/2,H-99,25,'center','#f7efd3');}
  if(messageTimer>0){roundRect(W/2-260,135,520,44,12,'#0d211ecc');drawText(message,W/2,157,18,'center','#fff','sans');}
  if(fishing&&fishing.active)drawFishingGame();
  if(paused){ctx.fillStyle='#071310cc';ctx.fillRect(0,0,W,H);drawText('遊戲暫停',W/2,H/2-20,52,'center','#f2e7c5');drawText('按 P 繼續',W/2,H/2+50,22,'center','#fff','sans');}
  if(flash>0){ctx.fillStyle='#fff8';ctx.fillRect(0,0,W,H);}
  if(activeQuiz)drawQuizPanel();
}

function drawPlay(){
  if(level===1){drawBoatMode();drawParticles();drawOverlays();return;}
  ctx.save();if(shake>1)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBackground();drawObjects();for(const e of enemies)drawEnemy(e);drawProjectiles();if(level===3)drawBoss();drawPlayer();drawParticles();ctx.restore();drawHUD();drawOverlays();
}

function drawTitle(){
  drawBackground();ctx.fillStyle='#07161399';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,145);ctx.fillStyle='#f1e7c8';ctx.strokeStyle='#6b4b2b';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-360,-80,720,190,25);ctx.fill();ctx.stroke();drawText('富春江行',0,-16,74,'center','#173e35', 'serif',false);drawText('奇山異水',0,62,38,'center','#8d4939','serif',false);ctx.restore();
  drawText('《與宋元思書》橫向卷軸動作遊戲',W/2,330,27,'center','#f7efd7');
  roundRect(W/2-340,390,680,138,20,'#102a2699','#d8c99655');
  drawText('WASD／方向鍵：移動　 J：斬擊／蓄力／互動',W/2,430,21,'center','#fff','sans');
  drawText('Shift：奔跑　 L：山水技能　 P：暫停',W/2,471,21,'center','#fff','sans');
  const pulse=.72+Math.sin(performance.now()*.005)*.28;ctx.globalAlpha=pulse;drawText('按 Enter 或點擊畫面開始',W/2,585,28,'center','#f1d77b','sans');ctx.globalAlpha=1;
  drawText('單一 HTML 檔，可離線執行',W/2,650,16,'center','#d9e5de','sans');
}

function drawGameOver(){drawPlay();ctx.fillStyle='#0a1210d9';ctx.fillRect(0,0,W,H);drawText('心神耗盡',W/2,270,58,'center','#e9d8b5');drawText('山水之旅尚未結束',W/2,340,24,'center','#fff');drawText('按 R 重新挑戰本章',W/2,450,26,'center','#f1d77b','sans');}

function drawEnding(){
  drawBackground();ctx.fillStyle='#07161388';ctx.fillRect(0,0,W,H);
  drawText('富春江重現清明',W/2,55,42,'center','#f4e6bd');
  roundRect(45,95,535,575,22,'#efe5ceeF','#6a5336');
  roundRect(600,95,635,575,22,'#102a26e8','#d8c99688');

  drawText('本次遊歷',312,130,26,'center','#254b40','serif',false);
  drawText(`悟境 ${score}`,312,185,40,'center','#8e483b','serif',false);
  drawText(`答題：對 ${quizCorrect}／共 ${quizTotal}　山水印記：${collected.length}`,312,238,20,'center','#3d5c52','sans',false);
  drawText('急湍止息，濁霧消散；心中亦復清明。',312,282,19,'center','#5d5545','serif',false);
  drawText('留下姓名或代號',ENDING_UI.input.x,320,18,'left','#254b40','sans',false);
  ctx.lineWidth=document.activeElement===nameInput?4:2;
  roundRect(ENDING_UI.input.x,ENDING_UI.input.y,ENDING_UI.input.w,ENDING_UI.input.h,12,'#fffaf0',document.activeElement===nameInput?'#2f6a4e':'#8b795b');
  const shownName=leaderboard.name||'點這裡輸入（1–16 字）';
  drawText(shownName,ENDING_UI.input.x+18,ENDING_UI.input.y+29,21,'left',leaderboard.name?'#253b34':'#988d78','sans',false);
  if(document.activeElement===nameInput&&!leaderboard.submitted&&Math.floor(performance.now()/500)%2===0){
    ctx.save();ctx.font='21px "Microsoft JhengHei",sans-serif';const caretX=ENDING_UI.input.x+20+ctx.measureText(leaderboard.name).width;ctx.strokeStyle='#254b40';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(caretX,ENDING_UI.input.y+17);ctx.lineTo(caretX,ENDING_UI.input.y+42);ctx.stroke();ctx.restore();
  }
  const submitFill=leaderboard.submitted?'#587c64':leaderboard.submitting?'#8a866f':'#254b40';
  roundRect(ENDING_UI.submit.x,ENDING_UI.submit.y,ENDING_UI.submit.w,ENDING_UI.submit.h,12,submitFill,'#d8c996');
  drawText(leaderboard.submitted?'成績已登錄':leaderboard.submitting?'正在送出…':'送出成績',312,ENDING_UI.submit.y+27,22,'center','#fff','sans',false);
  if(leaderboard.error)drawText(leaderboard.error,312,510,17,'center','#9b3f35','sans',false);
  else if(leaderboard.message)drawText(leaderboard.message,312,510,18,'center','#2f6a4e','sans',false);
  else drawText('輸入後按 Enter 或點擊送出',312,510,16,'center','#716957','sans',false);
  drawText('分數來自戰鬥、答題、印記與釣魚挑戰',312,550,16,'center','#716957','sans',false);
  roundRect(ENDING_UI.restart.x,ENDING_UI.restart.y,ENDING_UI.restart.w,ENDING_UI.restart.h,10,'#d8c996','#6a5336');
  drawText('再次遊歷富春江',312,ENDING_UI.restart.y+21,18,'center','#254b40','sans',false);

  drawText('富春江悟境排行榜',918,130,27,'center','#f4e6bd','serif',false);
  drawText('名次',630,164,15,'left','#b9cbbf','sans',false);drawText('姓名／代號',690,164,15,'left','#b9cbbf','sans',false);drawText('答對',1080,164,15,'right','#b9cbbf','sans',false);drawText('悟境',1200,164,15,'right','#b9cbbf','sans',false);
  if(leaderboard.loading)drawText('正在取得排行榜…',918,350,20,'center','#d8e8d8','sans',false);
  else if(!leaderboard.rows.length)drawText(leaderboard.error||'尚無成績，等你留下第一筆！',918,350,19,'center','#d8e8d8','sans',false);
  else leaderboard.rows.forEach((row,i)=>{
    const y=190+i*43;roundRect(620,y-16,595,36,8,i%2?'#f3ead511':'#f3ead51c');
    const rankColor=i===0?'#f1d77b':i===1?'#d9e0dd':i===2?'#c88f65':'#d8e8d8';
    drawText(String(i+1),650,y,19,'center',rankColor,'sans',false);
    drawText(row.player_name,690,y,18,'left','#f7efd7','sans',false);
    drawText(`${row.quiz_correct}/${row.quiz_total}`,1080,y,16,'right','#b9cbbf','sans',false);
    drawText(String(row.score),1200,y,20,'right',rankColor,'sans',false);
  });
  drawText('依悟境排序；同分時依答對題數',918,646,15,'center','#9fb5aa','sans',false);
}

function render(){ctx.clearRect(0,0,W,H);if(gameState==='title')drawTitle();else if(gameState==='play')drawPlay();else if(gameState==='gameover')drawGameOver();else if(gameState==='ending')drawEnding();}

function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(gameState==='title'&&(pressed['enter']||pressed[' ']||pressed['mouse'])){gameState='play';resetGame();}
  if(gameState==='gameover'&&pressed['r']){gameState='play';startLevel(level);}
  if(gameState==='ending'&&pressed['enter']&&leaderboard.submitted)restartFromEnding();
  update(dt);render();pressed=Object.create(null);released=Object.create(null);requestAnimationFrame(loop);
}
canvas.addEventListener('pointerdown',e=>{
  ensureAudio();
  const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(activeQuiz){handleQuizPointer(x,y);return;}
  if(gameState==='ending'){handleEndingPointer(x,y);return;}
  pressed['mouse']=true;if(gameState==='title'){gameState='play';resetGame();}
});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
